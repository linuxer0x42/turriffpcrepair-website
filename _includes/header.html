<header class="site-header">
  <span class="scroll-progress" data-scroll-progress aria-hidden="true"></span>
  <div class="wrap header-inner">

    <a class="brand" href="{{ '/' | relative_url }}">
      <img class="brand-logo"
           src="{{ '/assets/img/profile-icon-160.png' | relative_url }}"
           alt="" width="52" height="52" decoding="async">
      <span class="brand-text">
        <span class="brand-name">TURRIFF</span>
        <span class="brand-sub">PC&nbsp;REPAIR</span>
      </span>
    </a>

    <nav class="nav" aria-label="Sections">
      <a href="#repairs">Repairs</a>
      <a href="#price">Price</a>
      <a href="#reviews">Reviews</a>
      <a href="#contact">Contact</a>
    </nav>

    <!-- Phone/mail glyphs: Material Icons (Apache 2.0).
         Facebook glyph: Font Awesome Free (icons CC BY 4.0). -->
    <div class="header-actions">
      <a class="icon-btn" href="tel:{{ site.phone_link }}"
         aria-label="Call {{ site.phone_display }}">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path fill="currentColor" d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
        </svg>
      </a>

      <a class="icon-btn" href="mailto:{{ site.email }}"
         aria-label="Email {{ site.email }}">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path fill="currentColor" d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/>
        </svg>
      </a>

      <a class="icon-btn icon-btn--facebook" href="{{ site.facebook_url }}"
         target="_blank" rel="noopener noreferrer"
         aria-label="Turriff PC Repair on Facebook">
        <svg viewBox="0 0 320 512" aria-hidden="true" focusable="false">
          <path fill="currentColor"
                d="M279.14 288l14.22-92.66h-88.91v-60.13c0-25.35 12.42-50.06 52.24-50.06h40.42V6.26S260.43 0 225.36 0c-73.22 0-121.08 44.38-121.08 124.72v70.62H22.89V288h81.39v224h100.17V288z"/>
        </svg>
      </a>
    </div>

  </div>
</header>
