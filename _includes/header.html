<header class="site-header">
  <span class="scroll-progress" data-scroll-progress aria-hidden="true"></span>
  <div class="wrap header-inner">

    <a class="brand" href="{{ '/' | relative_url }}">
      <img class="brand-logo"
           src="{{ '/assets/img/profile-icon-160.png' | relative_url }}"
           alt="" width="52" height="52" decoding="async">
      <span class="brand-text">
        <span class="brand-name">TURRIFF</span>
        <span class="brand-sub">PC&nbsp;REPAIR</span>
      </span>
    </a>

    <nav class="nav" aria-label="Sections">
      <a href="#repairs">Repairs</a>
      <a href="#price">Price</a>
      <a href="#contact">Contact</a>
    </nav>

    <!-- Facebook glyph from Font Awesome Free (icons CC BY 4.0) -->
    <a class="social-link" href="{{ site.facebook_url }}" target="_blank"
       rel="noopener noreferrer" aria-label="Turriff PC Repair on Facebook">
      <svg viewBox="0 0 320 512" aria-hidden="true" focusable="false">
        <path fill="currentColor"
              d="M279.14 288l14.22-92.66h-88.91v-60.13c0-25.35 12.42-50.06 52.24-50.06h40.42V6.26S260.43 0 225.36 0c-73.22 0-121.08 44.38-121.08 124.72v70.62H22.89V288h81.39v224h100.17V288z"/>
      </svg>
    </a>

    <a class="btn btn-call" href="tel:{{ site.phone_link }}">
      <span class="sr-only">Call </span>{{ site.phone_display }}
    </a>

  </div>
</header>
