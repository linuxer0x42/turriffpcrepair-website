# ---------------------------------------------------------------------------
# Turriff PC Repair - Jekyll configuration
# Change business details here once and the whole site follows.
# ---------------------------------------------------------------------------

title: Turriff PC Repair
tagline: Just computer repair. Done properly.
description: >-
  Computer repair in Turriff, Aberdeenshire. One flat rate of £30 per repair:
  Windows reinstalls, speed-ups, and any hardware upgrade - RAM, SSD, CPU,
  GPU, motherboard and more.

# Set these when the site goes live, e.g. https://turriffpcrepair.co.uk
# (baseurl stays empty for a domain root, use "/folder" for a project page)
url: ""
baseurl: ""

# --- business details (used in the header, contact section and schema) ---
phone_display: "07354 452514"
phone_link: "+447354452514"
price: "£30"

# --- address (shown beside the opening times and in the schema) ---
address:
  street: "14 and a half main street"
  locality: "Turriff"
  postcode: "AB534AD"

# --- opening times (listed on the contact section and in the schema) ---
opening_days:
  - Monday
  - Tuesday
  - Wednesday
  - Thursday
  - Friday
  - Saturday
opening_hours: "9am – 5pm"   # shown next to each open day
opening_opens: "09:00"       # used by the structured data
opening_closes: "17:00"
opening_closed_days:
  - Sunday

# --- Trustpilot reviews (section after the price band) ---
# Fill these in when the Trustpilot account is ready and reviews are rendered
# as cards. They are fetched at build time, so the API key is never written to
# the generated site. On CI, set TRUSTPILOT_API_KEY instead of committing it.
trustpilot:
  enabled: true             # false hides the section entirely
  business_unit_id: ""      # Trustpilot business unit ID
  api_key: ""               # Trustpilot API key (build time only)
  profile_url: ""           # e.g. https://uk.trustpilot.com/review/example.co.uk
  review_url: ""            # e.g. https://uk.trustpilot.com/evaluate/example.co.uk
                            # blank = derived from profile_url by swapping
                            # /review/ for /evaluate/
  per_page: 6               # how many reviews to show (1-20)
  cache_minutes: 360        # reuse the fetched copy for this long

lang: en-GB
timezone: Europe/London
markdown: kramdown
plugins: []

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  # 4K source for the hero backdrop - the resized copies in assets/img are
  # what the site actually serves, so keep the full-size original unpublished.
  - assets/4k-mobo-wp.jpg
